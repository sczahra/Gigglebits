<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f2b1b" />
  <title>Gigglebits</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">

  <style>
    :root{
      /* Default palette (Vault-ish) */
      --bg0:#08140e;
      --bg1:#0f2b1b;
      --panel:#0b1712cc;
      --panel2:#0b1712f0;
      --text:#c9ffd8;
      --muted:#8ddfb0;
      --accent:#52ff9a;
      --accent2:#2bdc78;
      --shadow:#030a07;

      --bubble:#0b1712ee;
      --bubbleText:#d7ffe6;

      --scanlineOpacity: .06;
      --grainOpacity: .10;

      --stagePad: 18px;
      --palSize: 180px; /* changes with scale preset */
    }

    /* Preset palettes (applied by data-theme on body) */
    body[data-theme="vault"]{
      --bg0:#08140e; --bg1:#0f2b1b; --panel:#0b1712cc; --text:#c9ffd8; --muted:#8ddfb0; --accent:#52ff9a; --accent2:#2bdc78;
      --bubble:#0b1712ee; --bubbleText:#d7ffe6;
    }
    body[data-theme="amber"]{
      --bg0:#120b05; --bg1:#2a190a; --panel:#1a1009cc; --text:#ffe6bf; --muted:#ffd08a; --accent:#ffbf47; --accent2:#ff8a2b;
      --bubble:#1a1009ee; --bubbleText:#fff1d6;
    }
    body[data-theme="pastel"]{
      --bg0:#0a0d16; --bg1:#131a2a; --panel:#0d1220cc; --text:#eef2ff; --muted:#b9c7ff; --accent:#9ad6ff; --accent2:#7aa6ff;
      --bubble:#0d1220ee; --bubbleText:#f3f6ff;
    }
    body[data-theme="mono"]{
      --bg0:#050505; --bg1:#111111; --panel:#0c0c0ccc; --text:#f2f2f2; --muted:#cfcfcf; --accent:#ffffff; --accent2:#bdbdbd;
      --bubble:#0c0c0cee; --bubbleText:#f7f7f7;
    }

    html,body{ height:100%; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background: radial-gradient(1200px 800px at 70% 20%, var(--bg1), var(--bg0));
      overflow:hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Background “locations” */
    body[data-bg="desk"]{
      background:
        radial-gradient(900px 520px at 70% 15%, var(--bg1) 85%, black), var(--bg0)),
        linear-gradient(180deg, var(--bg0) 70%, black), var(--bg0));
    }
    body[data-bg="cozy"]{
      background:
        radial-gradient(1000px 600px at 35% 25%, var(--accent2) 12%, var(--bg1)), var(--bg0)),
        linear-gradient(180deg, var(--bg1) 65%, #1b0b07), var(--bg0));
    }
    body[data-bg="minimal"]{
      background: linear-gradient(135deg, var(--bg1), var(--bg0));
    }

    /* VHS / subtle retro overlay */
    .vhs::before{
      content:"";
      position:fixed; inset:0;
      pointer-events:none;
      background:
        repeating-linear-gradient(to bottom,
          rgba(255,255,255,var(--scanlineOpacity)) 0px,
          rgba(255,255,255,var(--scanlineOpacity)) 1px,
          rgba(0,0,0,0) 3px,
          rgba(0,0,0,0) 6px
        );
      mix-blend-mode: overlay;
      opacity:.9;
    }
    .vhs::after{
      content:"";
      position:fixed; inset:-20%;
      pointer-events:none;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,var(--grainOpacity)) 0, rgba(255,255,255,0) 55%),
        radial-gradient(circle at 70% 60%, rgba(0,0,0,var(--grainOpacity)) 0, rgba(0,0,0,0) 60%);
      transform: rotate(3deg);
      mix-blend-mode: overlay;
      opacity:.55;
      filter: blur(1px);
      animation: grain 6s steps(10) infinite;
    }
    @keyframes grain{
      0%{ transform:translate3d(0,0,0) rotate(3deg); }
      20%{ transform:translate3d(-2%,1%,0) rotate(3deg); }
      40%{ transform:translate3d(1%,-1%,0) rotate(3deg); }
      60%{ transform:translate3d(2%,2%,0) rotate(3deg); }
      80%{ transform:translate3d(-1%,2%,0) rotate(3deg); }
      100%{ transform:translate3d(0,0,0) rotate(3deg); }
    }

    /* App layout */
    #app{
      position:relative;
      height:100%;
      display:flex;
      flex-direction:column;
    }

    /* Top row */
    #topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: calc(env(safe-area-inset-top) + 10px) var(--stagePad) 10px var(--stagePad);
      gap: 10px;
    }
    #brand{
      display:flex; align-items:baseline; gap:10px;
      user-select:none;
    }
    #brand h1{
      font-size: 16px; margin:0;
      letter-spacing:.10em;
      text-transform: uppercase;
      color: var(--text) 90%, var(--muted));
    }
    #status{
      font-size: 12px;
      color: var(--muted);
      opacity:.95;
    }

    .btn{
      appearance:none;
      border:1px solid var(--accent) 35%, transparent);
      background: currentColor 70%, transparent);
      color:var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      cursor:pointer;
      user-select:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
      backdrop-filter: blur(8px);
    }
    .btn:active{ transform: translateY(1px); }

    /* Stage */
    #stage{
      position:relative;
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px var(--stagePad);
    }

    #palWrap{
      position:relative;
      width: var(--palSize);
      height: var(--palSize);
      display:flex;
      align-items:center;
      justify-content:center;
      filter: drop-shadow(0 16px 22px rgba(0,0,0,.45));
      touch-action: manipulation;
      cursor: pointer;
    }

    /* Speech bubble */
    #bubble{
      position:absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      transform: translateX(-50%);
      min-width: 190px;
      max-width: min(340px, 80vw);
      background: var(--bubble);
      color: var(--bubbleText);
      border: 1px solid var(--accent) 25%, transparent);
      border-radius: 16px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.25;
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events:none;
      transition: opacity .2s ease, transform .2s ease;
    }
    #bubble.show{
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }
    #bubble .emoji{
      font-size: 26px;
      line-height: 1;
      display:inline-block;
      margin-right: 8px;
      vertical-align: -3px;
    }
    #bubble .small{
      color: var(--bubbleText) 70%, var(--muted));
      font-size: 12px;
    }

    /* Bottom input bar */
    #inputBar{
      padding: 10px var(--stagePad) calc(env(safe-area-inset-bottom) + 14px) var(--stagePad);
      display:flex;
      gap: 10px;
      align-items:center;
    }
    #text{
      flex:1;
      background: currentColor 72%, transparent);
      border: 1px solid var(--accent) 25%, transparent);
      border-radius: 14px;
      padding: 12px 12px;
      color: var(--text);
      outline:none;
      font-size: 16px;
      backdrop-filter: blur(10px);
    }
    #send{ padding: 12px 14px; border-radius: 14px; }

    /* Settings panel */
    #settings{
      position:fixed;
      inset: 0;
      display:none;
      align-items:flex-end;
      justify-content:center;
      background: rgba(0,0,0,.45);
      padding: 18px 12px calc(env(safe-area-inset-bottom) + 12px) 12px;
      backdrop-filter: blur(2px);
    }
    #settings.show{ display:flex; }
    #panel{
      width: min(680px, 100%);
      max-height: min(74vh, 700px);
      overflow:auto;
      background: var(--panel2);
      border: 1px solid var(--accent) 25%, transparent);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 22px 70px rgba(0,0,0,.55);
    }
    #panelHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    #panelHeader h2{
      margin:0;
      font-size: 14px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color: var(--text) 90%, var(--muted));
    }
    .section{
      border-top:1px solid var(--accent) 14%, transparent);
      padding-top: 12px;
      margin-top: 12px;
    }
    .section h3{
      margin:0 0 10px 0;
      font-size: 13px;
      color: var(--muted);
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .row{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
      margin: 8px 0;
    }
    .chip{
      border:1px solid var(--accent) 25%, transparent);
      background: currentColor 70%, transparent);
      padding: 10px 12px;
      border-radius: 999px;
      cursor:pointer;
      user-select:none;
      font-size: 14px;
    }
    .chip[aria-pressed="true"]{
      border-color: var(--accent) 70%, transparent);
      box-shadow: 0 0 0 2px var(--accent) 22%, transparent) inset;
    }
    label.toggle{
      display:flex; gap:10px; align-items:center;
      border:1px solid var(--accent) 18%, transparent);
      background: currentColor 70%, transparent);
      padding: 10px 12px;
      border-radius: 14px;
      user-select:none;
      cursor:pointer;
    }
    label.toggle input{ accent-color: var(--accent); transform: scale(1.1); }
    select{
      background: currentColor 72%, transparent);
      border:1px solid var(--accent) 20%, transparent);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 14px;
      outline:none;
    }
    .note{ font-size: 12px; color: var(--muted) 88%, var(--text)); opacity:.9; }

    /* SVG */
    svg{ width:100%; height:100%; overflow:visible; }

    /* Simple animations driven by CSS variables (JS updates the vars) */
    #palWrap{
      --tilt: 0deg;
      --bob: 0px;
      --squash: 1;
      transform: translateY(var(--bob)) scale(var(--squash)) rotate(var(--tilt));
      transition: transform .22s ease;
    }
    .blink{ opacity: 1; }
    .blink.closed{ opacity: 0; }

    /* Sleep overlay emoji */
    #zzz{
      position:absolute;
      right: -8px;
      top: -6px;
      font-size: 28px;
      opacity:0;
      transform: translateY(6px);
      transition: opacity .25s ease, transform .25s ease;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
      user-select:none;
      pointer-events:none;
    }
    #zzz.show{
      opacity: 1;
      transform: translateY(0);
      animation: floatZ 2.8s ease-in-out infinite;
    }
    @keyframes floatZ{
      0%{ transform: translateY(0); opacity:.9; }
      50%{ transform: translateY(-6px); opacity:.75; }
      100%{ transform: translateY(0); opacity:.9; }
    }

    /* “Always-present pal” positioning presets */
    body[data-scale="small"]{ --palSize: 150px; }
    body[data-scale="medium"]{ --palSize: 210px; }
    body[data-scale="large"]{ --palSize: min(58vh, 420px); }

    /* When small: dock to bottom-right like an assistant */
    body[data-scale="small"] #stage{ align-items:flex-end; justify-content:flex-end; }
    body[data-scale="small"] #palWrap{ margin-bottom: 6px; }
    body[data-scale="small"] #bubble{
      left: auto;
      right: 0;
      transform: translateX(0);
      bottom: calc(100% + 10px);
    }
    body[data-scale="small"] #bubble.show{ transform: translateY(-2px); }


    /* Avatar micro-animations */
    .breath{ animation: breath 3.6s ease-in-out infinite; transform-origin: 50% 80%; }
    .breathSlow{ animation: breath 5.4s ease-in-out infinite; transform-origin: 50% 80%; }
    .nod{ animation: nod 4.8s ease-in-out infinite; transform-origin: 50% 70%; }
    .wag{ animation: wag 1.6s ease-in-out infinite; transform-origin: 188px 96px; }
    .tailFlick{ animation: tailFlick 2.8s ease-in-out infinite; transform-origin: 145px 126px; }

    @keyframes breath{
      0%,100%{ transform: translateY(0) scaleY(1); }
      50%{ transform: translateY(1px) scaleY(1.015); }
    }
    @keyframes nod{
      0%,100%{ transform: rotate(-1deg) translateY(0); }
      50%{ transform: rotate(1.5deg) translateY(1px); }
    }
    @keyframes wag{
      0%,100%{ transform: rotate(18deg); }
      50%{ transform: rotate(-18deg); }
    }
    @keyframes tailFlick{
      0%,100%{ transform: rotate(8deg); }
      45%{ transform: rotate(-10deg); }
      60%{ transform: rotate(4deg); }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce){
      .vhs::after{ animation:none; }
      #palWrap{ transition:none; }
      #bubble{ transition:none; }
      #zzz.show{ animation:none; }
    }
  </style>
</head>

<body class="vhs" data-theme="vault" data-bg="desk" data-scale="small">
  <div id="app">
    <div id="topbar">
      <div id="brand">
        <h1>Gigglebits</h1>
        <div id="status">offline pal</div>
      </div>
      <button class="btn" id="openSettings" aria-label="Open settings">⚙️ <span style="font-size:13px;opacity:.9">Settings</span></button>
    </div>

    <div id="stage" aria-label="Pal stage">
      <div id="palWrap" title="Tap me" role="button" aria-label="Gigglebits pal">
        <div id="bubble" aria-live="polite"></div>
        <div id="zzz">💤</div>

        <div id="avatar" aria-hidden="true"></div>

      </div>
    </div>

    <div id="inputBar">
      <input id="text" inputmode="text" autocomplete="off" placeholder="Type something…" />
      <button class="btn" id="send" aria-label="Send">➤</button>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings" role="dialog" aria-modal="true" aria-label="Settings">
    <div id="panel">
      <div id="panelHeader">
        <h2>Settings</h2>
        <button class="btn" id="closeSettings">✕ Close</button>
      </div>

      <div class="section">
        <h3>Character</h3>
        <div class="row" id="scaleRow">
          <span class="note">Scale:</span>
          <button class="chip" data-scale="small" aria-pressed="true">Small</button>
          <button class="chip" data-scale="medium" aria-pressed="false">Medium</button>
          <button class="chip" data-scale="large" aria-pressed="false">Large</button>
        </div>
        <div class="row">
          <span class="note">Characters:</span>
          <button class="chip" data-char="clippy" aria-pressed="true">Clippy pal</button>
          <button class="chip" data-char="train" aria-pressed="false" disabled title="Planned">Train (later)</button>
          <button class="chip" data-char="dachshund" aria-pressed="false">Dachshund</button>
          <button class="chip" data-char="cat" aria-pressed="false">White cat</button>
        </div>
        <div class="note">Tip: tap the pal to wake it up or get a reaction.</div>
      </div>

      <div class="section">
        <h3>Appearance</h3>
        <div class="row" id="themeRow">
          <span class="note">Palette:</span>
          <button class="chip" data-theme="vault" aria-pressed="true">Vault</button>
          <button class="chip" data-theme="amber" aria-pressed="false">Amber CRT</button>
          <button class="chip" data-theme="pastel" aria-pressed="false">Soft</button>
          <button class="chip" data-theme="mono" aria-pressed="false">Mono</button>
        </div>
        <div class="row">
          <label class="toggle"><input type="checkbox" id="vhsToggle" checked> VHS overlay</label>
        </div>
      </div>

      <div class="section">
        <h3>Environment</h3>
        <div class="row" id="bgRow">
          <span class="note">Background:</span>
          <button class="chip" data-bg="desk" aria-pressed="true">Desk</button>
          <button class="chip" data-bg="cozy" aria-pressed="false">Cozy</button>
          <button class="chip" data-bg="minimal" aria-pressed="false">Minimal</button>
        </div>
        <div class="row">
          <label class="toggle"><input type="checkbox" id="bgRandom"> Random on wake</label>
        </div>
      </div>

      <div class="section">
        <h3>Behavior</h3>
        <div class="row">
          <span class="note">Intensity:</span>
          <select id="intensity">
            <option value="calm">Calm</option>
            <option value="balanced" selected>Balanced</option>
            <option value="expressive">Expressive</option>
          </select>
        </div>

        <div class="row">
          <label class="toggle"><input type="checkbox" id="sleepEnabled" checked> Sleep enabled</label>
          <select id="sleepDelay">
            <option value="short">Sleep delay: Short</option>
            <option value="medium" selected>Sleep delay: Medium</option>
            <option value="long">Sleep delay: Long</option>
          </select>
        </div>
      </div>

      <div class="section">
        <h3>Communication</h3>
        <div class="row">
          <label class="toggle"><input type="checkbox" id="bubbleEnabled" checked> Speech bubble</label>
          <label class="toggle"><input type="checkbox" id="emojiEnabled" checked> Emoji reactions</label>
        </div>
        <div class="row">
          <span class="note">Text:</span>
          <select id="verbosity">
            <option value="minimal">Minimal</option>
            <option value="short" selected>Short</option>
            <option value="silent">Silent (emoji only)</option>
          </select>
        </div>
      </div>

      <div class="section">
        <h3>System</h3>
        <div class="row">
          <button class="btn" id="exportBtn">⬇ Export data</button>
          <label class="btn" style="cursor:pointer;">
            ⬆ Import data
            <input id="importFile" type="file" accept="application/json" style="display:none;">
          </label>
          <button class="btn" id="resetBtn">↺ Reset</button>
        </div>
        <div class="note">Offline-first. Data stays on this device unless you export it.</div>
      </div>
    </div>
  </div>

<script>
(() => {
  // ---------- Utilities ----------
  const $ = (sel, el=document) => el.querySelector(sel);
  const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));

  const now = () => Date.now();
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

  // ---------- State ----------
  const DEFAULTS = {
    theme: "vault",
    character: "clippy",
    bg: "desk",
    scale: "small",
    vhs: true,
    bgRandom: false,
    intensity: "balanced", // calm | balanced | expressive
    sleepEnabled: true,
    sleepDelay: "medium",  // short|medium|long
    bubbleEnabled: true,
    emojiEnabled: true,
    verbosity: "short",    // minimal|short|silent
    customPalette: null,   // reserved
  };

  const KEY = "gigglebits.v1";
  const loadState = () => {
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return {...DEFAULTS};
      const parsed = JSON.parse(raw);
      return {...DEFAULTS, ...parsed};
    }catch(e){
      return {...DEFAULTS};
    }
  };
  const saveState = () => localStorage.setItem(KEY, JSON.stringify(state));

  let state = loadState();

  // ---------- Elements ----------
  const body = document.body;
  const pal = $("#palWrap");
  const bubble = $("#bubble");
  const zzz = $("#zzz");
  const avatar = $("#avatar");
  let eyesOpen = null;
  let eyesClosed = null;
  let mouth = null;
  const vhsToggle = $("#vhsToggle");

  // ---------- Avatar templates ----------
  const SVG = {
    clippy: `<svg viewBox="0 0 200 200" aria-hidden="true">
<defs>
<linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1">

<!-- Outer silhouette -->
<path d="M92 30

<!-- Face plate -->

stroke="var(--accent) 30%, transparent)"
stroke-width="1.6"/>
<!-- Eyes (open) -->

<circle cx="122" cy="92" r="6" fill="var(--text) 90%, black)"/>
<circle cx="88" cy="90" r="2" fill="white" opacity=".9"/>
<circle cx="120" cy="90" r="2" fill="white" opacity=".9"/>
</g>
<!-- Eyes (closed) -->

<!-- Arm-ish flourish -->
<path d="M58 108

</svg>`,
    dachshund_awake: `
      <svg viewBox="0 0 220 160" aria-hidden="true">
        <defs>

  const CHARACTERS = [
    { id:"clippy", label:"Clippy pal", awake:() => SVG.clippy, sleep:() => SVG.clippy, supportsFace:true },
    { id:"dachshund", label:"Dachshund", awake:() => SVG.dachshund_awake, sleep:() => SVG.dachshund_sleep, supportsFace:true },
    { id:"cat", label:"White cat", awake:() => SVG.cat_awake, sleep:() => SVG.cat_sleep, supportsFace:true },
  ];

  function cacheFaceEls(){
    // re-cache face elements after avatar render
    eyesOpen = avatar ? avatar.querySelector("#eyesOpen") : null;
    eyesClosed = avatar ? avatar.querySelector("#eyesClosed") : null;
    mouth = avatar ? avatar.querySelector("#mouth") : null;
  }

  function renderAvatar(){
    const def = CHARACTERS.find(c => c.id === state.character) || CHARACTERS[0];
    const markup = (asleep && state.sleepEnabled) ? def.sleep() : def.awake();
    avatar.innerHTML = markup;
    // tag for CSS
    pal.setAttribute("data-char", def.id);
    cacheFaceEls();
    // ensure eyes state matches sleep flag for clippy-style faces
    if(asleep && state.sleepEnabled){
      setEyes(false);
      setFace("sleep");
    }else{
      setEyes(true);
      setFace("neutral");
    }
  }

  function setEyes(open){
    if(!eyesOpen || !eyesClosed) return;
    eyesOpen.style.display = open ? "" : "none";
    eyesClosed.style.display = open ? "none" : "";
  }

  // Settings controls
  const settings = $("#settings");
  const openSettings = $("#openSettings");
  const closeSettings = $("#closeSettings");
  const textInput = $("#text");
  const sendBtn = $("#send");

  // ---------- Apply settings to UI ----------
  function applyTheme(theme){
    body.dataset.theme = theme;
    $$("#themeRow .chip").forEach(btn=>{
      btn.setAttribute("aria-pressed", String(btn.dataset.theme === theme));
    });
  }
  function applyBg(bg){
    body.dataset.bg = bg;
    $$("#bgRow .chip").forEach(btn=>{
      btn.setAttribute("aria-pressed", String(btn.dataset.bg === bg));
    });
  }
  function applyScale(scale){
    body.dataset.scale = scale;
    $$("#scaleRow .chip").forEach(btn=>{
      btn.setAttribute("aria-pressed", String(btn.dataset.scale === scale));
    });
  }
  function applyVhs(on){
    body.classList.toggle("vhs", !!on);
    vhsToggle.checked = !!on;
  }

  function syncControls(){
    applyTheme(state.theme);
    applyBg(state.bg);
    applyScale(state.scale);
    applyVhs(state.vhs);

    $("#bgRandom").checked = state.bgRandom;
    $("#intensity").value = state.intensity;
    $("#sleepEnabled").checked = state.sleepEnabled;
    $("#sleepDelay").value = state.sleepDelay;
    $("#bubbleEnabled").checked = state.bubbleEnabled;
    $("#emojiEnabled").checked = state.emojiEnabled;
    $("#verbosity").value = state.verbosity;
  }

  // ---------- Pal “alive” behavior ----------
  const delays = {
    calm:      { idleMin: 4200, idleMax: 7600, boredom: 15000 },
    balanced:  { idleMin: 2600, idleMax: 5200, boredom: 12000 },
    expressive:{ idleMin: 1600, idleMax: 3400, boredom: 9000  },
  };
  const sleepAfter = {
    short:  22000,
    medium: 35000,
    long:   55000
  };

  let lastInteraction = now();
  let asleep = false;
  let bored = false;
  let idleTimer = null;
  let blinkTimer = null;

  function setFace(mode){
    // mode: "neutral"|"happy"|"confused"|"sleep"
    if(!mouth){
      pal.setAttribute("data-face", mode);
      return;
    }
    if(mode === "happy"){
      mouth.setAttribute("d","M92 112 Q106 124 120 112");
    }else if(mode === "confused"){
      mouth.setAttribute("d","M94 114 Q106 108 118 114");
    }else if(mode === "sleep"){
      // a tiny relaxed curve (works for clippy; other avatars override by swapping SVG)
      mouth.setAttribute("d","M94 116 Q106 120 118 116");
    }else{
      mouth.setAttribute("d","M92 114 Q106 116 120 114");
    }
    pal.setAttribute("data-face", mode);
  }

  function setBlink(closed){
    eyesOpen.style.opacity = closed ? "0" : "1";
    eyesClosed.classList.toggle("closed", !closed);
    eyesClosed.style.opacity = closed ? "1" : "0";
  }

  function pose({tilt=0, bob=0, squash=1}){
    pal.style.setProperty("--tilt", tilt + "deg");
    pal.style.setProperty("--bob", bob + "px");
    pal.style.setProperty("--squash", squash);
  }

  function showBubble({emoji=null, text="", small=""}){
    if(!state.bubbleEnabled && !state.emojiEnabled) return;

    const useEmoji = state.emojiEnabled && emoji;
    const useText  = state.bubbleEnabled && state.verbosity !== "silent";

    if(!useEmoji && !useText) return;

    let html = "";
    if(useEmoji) html += `<span class="emoji">${emoji}</span>`;
    if(useText){
      const t = (state.verbosity === "minimal") ? text.split(" ").slice(0,3).join(" ") : text;
      html += `<span>${escapeHtml(t)}</span>`;
    }
    if(small && state.bubbleEnabled && state.verbosity !== "silent"){
      html += `<div class="small">${escapeHtml(small)}</div>`;
    }

    bubble.innerHTML = html;
    bubble.classList.add("show");
    clearTimeout(showBubble._t);
    showBubble._t = setTimeout(()=>bubble.classList.remove("show"), 2600);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function randomChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function react(type){
    // type: "tap"|"message"|"question"|"excited"|"negative"|"neutral"
    const intensity = state.intensity;
    const big = (intensity === "expressive");
    const mid = (intensity === "balanced");

    const bump = big ? 9 : (mid ? 6 : 4);
    const tilt = big ? 10 : (mid ? 7 : 4);

    if(type === "tap"){
      setFace("happy");
      pose({tilt: randomChoice([-tilt, tilt]), bob: -bump, squash: 1.02});
      showBubble({emoji:"👋", text:"Hey!", small:"tap to wake / react"});
    }else if(type === "question"){
      setFace("confused");
      pose({tilt: tilt, bob: -bump+2, squash: 1.00});
      showBubble({emoji:"❓", text:"Hmm…", small:"thinking"});
    }else if(type === "excited"){
      setFace("happy");
      pose({tilt: -tilt, bob: -bump, squash: 1.03});
      showBubble({emoji:"✨", text:"Nice!", small:""});
    }else if(type === "negative"){
      setFace("neutral");
      pose({tilt: tilt/2, bob: -2, squash: .99});
      showBubble({emoji:"💭", text:"Got it.", small:""});
    }else if(type === "message"){
      setFace("neutral");
      pose({tilt: randomChoice([-tilt/2, tilt/2]), bob: -3, squash: 1.00});
      showBubble({emoji:"💬", text:"Okay.", small:""});
    }else{
      setFace("neutral");
      pose({tilt: 0, bob: 0, squash: 1});
    }

    // recover
    clearTimeout(react._t);
    react._t = setTimeout(()=>pose({tilt:0,bob:0,squash:1}), 420);
    clearTimeout(react._f);
    react._f = setTimeout(()=>setFace(asleep ? "sleep" : "neutral"), 900);
  }

  function doBlink(){
    if(asleep) return;
    setEyes(false);
    setTimeout(() => setEyes(true), 160);
  }

  function scheduleBlink(){
    clearTimeout(blinkTimer);
    const base = state.intensity === "calm" ? 3200 : state.intensity === "expressive" ? 1800 : 2400;
    const jitter = Math.random()*1400;
    blinkTimer = setTimeout(()=>{
      doBlink();
      scheduleBlink();
    }, base + jitter);
  }

  function idleTick(){
    clearTimeout(idleTimer);
    const cfg = delays[state.intensity] || delays.balanced;

    const since = now() - lastInteraction;
    const shouldBore = since > cfg.boredom && !asleep;
    if(shouldBore && !bored){
      bored = true;
      setFace("neutral");
      showBubble({emoji:"😐", text:"…", small:"bored"});
      pose({tilt: 2, bob: 1, squash: .995});
    }

    if(state.sleepEnabled){
      const sAfter = sleepAfter[state.sleepDelay] || sleepAfter.medium;
      if(since > sAfter && !asleep){
        goToSleep();
      }
    }

    if(!asleep){
      // gentle idle motion
      const tilt = randomChoice([-3,-2,0,2,3]);
      const bob = randomChoice([0,1,-1,2,-2]);
      pose({tilt, bob, squash: 1});
    }

    const next = cfg.idleMin + Math.random()*(cfg.idleMax - cfg.idleMin);
    idleTimer = setTimeout(idleTick, next);
  }

  function goToSleep(){
    asleep = true;
    bored = false;
    setFace("sleep");
    setBlink(true);
    zzz.classList.add("show");
    // “slump”
    pose({tilt: 6, bob: 6, squash: .99});
    showBubble({emoji:"😴", text:"Zzz…", small:""});
    scheduleBlink(); // will effectively stop blinking because asleep
  }

  function wakeUp(reason="wake"){
    if(!asleep && !bored) return;
    const wasAsleep = asleep;
    asleep = false;
    bored = false;
    zzz.classList.remove("show");
    setBlink(false);
    setFace("neutral");
    pose({tilt:0,bob:0,squash:1});

    if(state.bgRandom && wasAsleep){
      const bgs = ["desk","cozy","minimal"];
      const pick = randomChoice(bgs);
      state.bg = pick;
      applyBg(pick);
      saveState();
    }
    showBubble({emoji: wasAsleep ? "😵‍💫" : "👀", text: wasAsleep ? "Oh! I fell asleep." : "Hey.", small:""});
    scheduleBlink();
  }

  function registerInteraction(){
    lastInteraction = now();
    if(asleep || bored) wakeUp();
  }

  // ---------- Message parsing (offline simple) ----------
  function analyzeMessage(msg){
    const m = msg.trim();
    if(!m) return {type:"neutral"};
    const lower = m.toLowerCase();
    const excited = /(!{2,}|\b(wow|yay|awesome|nice|cool|lol|haha)\b)/.test(lower);
    const negative = /\b(sad|bad|mad|angry|ugh|tired|hate)\b/.test(lower);
    const question = /\?$/.test(m) || /\b(why|how|what|when|where|who)\b/.test(lower);
    if(question) return {type:"question"};
    if(excited) return {type:"excited"};
    if(negative) return {type:"negative"};
    return {type:"message"};
  }

  // ---------- Wire up UI ----------
  function openPanel(){
    settings.classList.add("show");
    react("neutral");
  }
  function closePanel(){
    settings.classList.remove("show");
  }

  openSettings.addEventListener("click", () => { registerInteraction(); openPanel(); });
  closeSettings.addEventListener("click", () => { registerInteraction(); closePanel(); });
  settings.addEventListener("click", (e) => { if(e.target === settings) closePanel(); });

  pal.addEventListener("click", () => { registerInteraction(); react("tap"); });

  textInput.addEventListener("input", () => {
    registerInteraction();
    if(!asleep){
      // subtle “listening” lean while typing
      pal.style.setProperty("--tilt", "-2deg");
    }
  });

  function send(){
    const msg = textInput.value.trim();
    if(!msg) return;
    registerInteraction();
    const {type} = analyzeMessage(msg);
    react(type);
    textInput.value = "";
    pal.style.setProperty("--tilt","0deg");
  }
  sendBtn.addEventListener("click", send);
  textInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){ e.preventDefault(); send(); }
  });

  // Theme chips
  $$("#themeRow .chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      registerInteraction();
      const t = btn.dataset.theme;
      state.theme = t;
      applyTheme(t);
      saveState();
      showBubble({emoji:"🎨", text:`Palette: ${btn.textContent}`, small:""});
    });
  });

  // BG chips
  $$("#bgRow .chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      registerInteraction();
      const b = btn.dataset.bg;
      state.bg = b;
      applyBg(b);
      saveState();
      showBubble({emoji:"🗺️", text:`Background: ${btn.textContent}`, small:""});
    });
  });

  // Scale chips
  $$("#scaleRow .chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      registerInteraction();
      const s = btn.dataset.scale;
      state.scale = s;
      applyScale(s);
      saveState();
      showBubble({emoji:"📐", text:`Scale: ${btn.textContent}`, small:""});
    });
  });

  // Toggles / selects
  $("#bgRandom").addEventListener("change", (e)=>{ registerInteraction(); state.bgRandom = e.target.checked; saveState(); });
  $("#intensity").addEventListener("change", (e)=>{ registerInteraction(); state.intensity = e.target.value; saveState(); scheduleBlink(); idleTick(); });
  $("#sleepEnabled").addEventListener("change", (e)=>{ registerInteraction(); state.sleepEnabled = e.target.checked; saveState(); if(!state.sleepEnabled && asleep) wakeUp(); });
  $("#sleepDelay").addEventListener("change", (e)=>{ registerInteraction(); state.sleepDelay = e.target.value; saveState(); });
  $("#bubbleEnabled").addEventListener("change", (e)=>{ registerInteraction(); state.bubbleEnabled = e.target.checked; saveState(); });
  $("#emojiEnabled").addEventListener("change", (e)=>{ registerInteraction(); state.emojiEnabled = e.target.checked; saveState(); });
  $("#verbosity").addEventListener("change", (e)=>{ registerInteraction(); state.verbosity = e.target.value; saveState(); });

  vhsToggle.addEventListener("change", (e)=>{ registerInteraction(); state.vhs = e.target.checked; applyVhs(state.vhs); saveState(); });

  // Export / Import / Reset
  $("#exportBtn").addEventListener("click", ()=>{
    registerInteraction();
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "gigglebits-settings.json";
    a.click();
    URL.revokeObjectURL(a.href);
    showBubble({emoji:"⬇️", text:"Exported settings.", small:""});
  });

  $("#importFile").addEventListener("change", async (e)=>{
    registerInteraction();
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    try{
      const txt = await f.text();
      const parsed = JSON.parse(txt);
      state = {...DEFAULTS, ...parsed};
      saveState();
      syncControls();
      showBubble({emoji:"⬆️", text:"Imported settings.", small:""});
    }catch(err){
      showBubble({emoji:"⚠️", text:"Import failed.", small:"Invalid file"});
    }finally{
      e.target.value = "";
    }
  });

  $("#resetBtn").addEventListener("click", ()=>{
    registerInteraction();
    state = {...DEFAULTS};
    saveState();
    syncControls();
    asleep = false; bored = false;
    zzz.classList.remove("show");
    setBlink(false); setFace("neutral"); pose({tilt:0,bob:0,squash:1});
    showBubble({emoji:"↺", text:"Reset to defaults.", small:""});
  });

  // ---------- PWA Service Worker ----------
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    });
  }

  // ---------- Init ----------
  syncControls();
  setBlink(false);
  setFace("neutral");
  pose({tilt:0,bob:0,squash:1});
  scheduleBlink();
  idleTick();

  // friendly hello (only if bubble enabled)
  setTimeout(()=>{
    showBubble({emoji:"👋", text:"Hi. I’m your offline pal.", small:"tap me or type below"});
  }, 450);
})();
</script>
</body>
</html>

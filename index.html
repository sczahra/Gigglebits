<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#063f2b" />
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>Gigglebits</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <div class="title">GIGGLEBITS</div>
        <div class="sub">offline pal <span id="ver" data-version="0.3.0">v0.3.0</span></div>
      </div>
      <button id="settingsBtn" aria-label="Open settings">⚙︎ Settings</button>
    </header>

    <main id="stage" aria-label="Stage">
      <div id="scanlines"></div>

      <div id="charWrap" aria-label="Cat">
        <div id="catSprite" aria-hidden="true">
          <img id="cat" class="alive" src="cat.png" alt="White cat with heterochromia" />
        </div>
        <div style="display:flex; flex-direction:column; gap:10px; align-items:flex-start;">
          <div id="bubble" aria-live="polite"></div>
          <div id="bigEmoji" aria-hidden="true"></div>
        </div>
      </div>

      <div id="modalBackdrop" aria-hidden="true">
        <div id="modal" role="dialog" aria-modal="true" aria-label="Settings">
          <div class="modalHeader">
            <h2>Settings</h2>
            <button id="modalClose" aria-label="Close settings">✕</button>
          </div>

          <div class="section">
            <h3>Appearance</h3>
            <div class="row">
              <label for="palette">Color palette</label>
              <select id="palette">
                <option value="vault">Vault Green</option>
                <option value="amber">Amber CRT</option>
                <option value="soft">Soft Blue</option>
                <option value="mono">Mono Noir</option>
              </select>
            </div>
            <div class="row">
              <label for="vhs">VHS overlay</label>
              <input id="vhs" type="checkbox" />
            </div>
            <div class="row">
              <label for="charSize">Character size</label>
              <select id="charSize">
                <option value="small">Small (docked)</option>
                <option value="medium">Medium</option>
                <option value="large">Large (main focus)</option>
              </select>
            </div>
          </div>

          <div class="section">
            <h3>Environment</h3>
            <div class="row">
              <label for="background">Background</label>
              <select id="background">
                <option value="desk">Desk / Terminal</option>
                <option value="cozy">Cozy Room</option>
                <option value="minimal">Minimal</option>
              </select>
            </div>
            <div class="row">
              <label for="bgMode">Background mode</label>
              <select id="bgMode">
                <option value="fixed">Fixed</option>
                <option value="random">Random on wake</option>
              </select>
            </div>
            <div class="row">
              <label for="movement">Movement</label>
              <select id="movement">
                <option value="roam">Roam (subtle)</option>
                <option value="static">Static</option>
              </select>
            </div>
            <div class="smallNote">You can add more backgrounds later without changing the app logic.</div>
          </div>

          <div class="section">
            <h3>Behavior</h3>
            <div class="row">
              <label for="intensity">Personality intensity</label>
              <select id="intensity">
                <option value="calm">Calm</option>
                <option value="balanced">Balanced</option>
                <option value="expressive">Expressive</option>
              </select>
            </div>
            <div class="row">
              <label for="sleepEnabled">Sleep enabled</label>
              <input id="sleepEnabled" type="checkbox" />
            </div>
            <div class="row">
              <label for="sleepDelay">Sleep delay</label>
              <select id="sleepDelay">
                <option value="short">Short</option>
                <option value="medium">Medium</option>
                <option value="long">Long</option>
              </select>
            </div>
          </div>

          <div class="section">
            <h3>Communication</h3>
            <div class="row">
              <label for="bubbles">Speech bubbles</label>
              <input id="bubbles" type="checkbox" />
            </div>
            <div class="row">
              <label for="emojis">Emoji reactions</label>
              <input id="emojis" type="checkbox" />
            </div>
            <div class="row">
              <label for="verbosity">Text verbosity</label>
              <select id="verbosity">
                <option value="minimal">Minimal</option>
                <option value="short">Short</option>
                <option value="silent">Silent (emoji only)</option>
              </select>
            </div>
          </div>

          <div class="section">
            <h3>System</h3>
            <div class="fileRow">
              <a class="dl" href="javascript:void(0)" id="exportBtn">⬇︎ Export settings</a>
              <label class="dl" style="cursor:pointer;">
                ⬆︎ Import settings
                <input class="hidden" id="importFile" type="file" accept="application/json" />
              </label>
              <a class="dl" href="javascript:void(0)" id="resetBtn">↺ Reset</a>
            </div>
            <div class="smallNote">Offline-first. Settings are stored on this device.</div>
          </div>
        </div>
      </div>
    </main>

    <footer id="composer" aria-label="Composer">
      <input id="input" type="text" autocomplete="off" autocapitalize="sentences" placeholder="Type something…" />
      <button id="send" aria-label="Send">➤</button>
    </footer>
  </div>

  <script src="main.js"></script>
</body>
</html>

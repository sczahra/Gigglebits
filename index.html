<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gigglebits</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg:#0b2b1a;
  --accent:#6cffb0;
}
html,body {
  margin:0;
  height:100%;
  background:var(--bg);
  font-family:-apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color:#b6ffd9;
}
#top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  letter-spacing:2px;
}
#pal {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}
.character {
  width:140px;
  height:140px;
  position:relative;
}
.eye {
  width:14px;height:14px;border-radius:50%;
  background:#000;
  position:absolute;top:40px;
}
.blink {
  animation:blink 6s infinite;
}
@keyframes blink {
  0%,92%,100%{transform:scaleY(1)}
  94%,96%{transform:scaleY(0.1)}
}
.body {
  width:100%;height:100%;
  border-radius:20px;
  background:#6cffb0;
}
.sleep {
  opacity:.6;
}
#chat {
  position:fixed;
  bottom:16px;
  left:16px;right:16px;
  display:flex;
  gap:10px;
}
input {
  flex:1;
  background:#0e3a25;
  border:1px solid #3a7;
  border-radius:12px;
  padding:12px;
  color:#b6ffd9;
}
button {
  background:#1f5;
  border:none;
  border-radius:50%;
  width:44px;
  height:44px;
}
</style>
</head>
<body>
<div id="top">
  <div><strong>GIGGLEBITS</strong> <small>offline pal</small></div>
  <div>⚙️</div>
</div>

<div id="pal">
  <div class="character" id="char">
    <div class="body"></div>
    <div class="eye blink" style="left:40px"></div>
    <div class="eye blink" style="right:40px"></div>
  </div>
</div>

<div id="chat">
  <input placeholder="Type something…"/>
  <button>▶</button>
</div>

<script>
let idleTimer;
function sleep(){
  document.getElementById("char").classList.add("sleep");
}
function wake(){
  document.getElementById("char").classList.remove("sleep");
}
function resetIdle(){
  wake();
  clearTimeout(idleTimer);
  idleTimer=setTimeout(sleep,8000);
}
document.addEventListener("keydown",resetIdle);
resetIdle();
</script>
</body>
</html>
